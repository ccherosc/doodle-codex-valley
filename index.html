<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle Codex Valley</title>
<style>
:root {
  --bg: #efe8d8; --panel: #fbf7ee; --ink: #2e2a24; --muted: #6d655a;
  --line: #d9cfbb; --accent: #b4532a; --chip: #f1e9d8; --shadow: 0 6px 24px rgba(40,30,10,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1b18; --panel: #282520; --ink: #eee6d6; --muted: #a79d8c;
    --line: #3d3830; --accent: #e08457; --chip: #332f28; --shadow: 0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #1d1b18; --panel: #282520; --ink: #eee6d6; --muted: #a79d8c;
  --line: #3d3830; --accent: #e08457; --chip: #332f28; --shadow: 0 6px 24px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.drag { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
.bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px;
  align-items: center; pointer-events: none; flex-wrap: wrap; }
.bar > * { pointer-events: auto; }
.title { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 12px; box-shadow: var(--shadow); font-weight: 650; white-space: nowrap; }
.title small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.group { display: flex; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.group button { border: 0; background: none; color: var(--ink); font: inherit;
  padding: 7px 11px; cursor: pointer; border-right: 1px solid var(--line); min-width: 38px; }
.group button:last-child { border-right: 0; }
.group button:hover { background: var(--chip); }
.group button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.zoomlbl { padding: 7px 10px; color: var(--muted); font-variant-numeric: tabular-nums;
  min-width: 58px; text-align: center; border-right: 1px solid var(--line); }
.spacer { flex: 1; }
#legend { position: fixed; top: 64px; right: 12px; bottom: 12px; width: 300px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); overflow: auto; padding: 4px 12px 12px; transition: transform .2s; }
#legend.hidden { transform: translateX(calc(100% + 24px)); }
#legend h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 14px 0 6px; display: flex; justify-content: space-between; }
#legend .item { display: flex; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 8px;
  cursor: pointer; }
#legend .item:hover, #legend .item.on { background: var(--chip); }
#legend .thumb { width: 36px; height: 36px; flex: none; image-rendering: pixelated;
  border-radius: 6px; background: var(--chip); }
#legend .name { font-weight: 600; }
#legend .note { color: var(--muted); font-size: 12.5px; }
#legend p { color: var(--muted); font-size: 12.5px; margin: 6px 0; }
#tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12.5px;
  box-shadow: var(--shadow); display: none; max-width: 240px; }
#tip b { display: block; }
.showui { position: fixed; top: 12px; left: 12px; display: none; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 7px 12px; font: inherit; cursor: pointer; opacity: .75; }
.showui:hover { opacity: 1; }
body.noui .bar, body.noui #legend, body.noui .hint { display: none; }
body.noui .showui { display: block; }
.hint { position: fixed; left: 12px; bottom: 12px; background: var(--panel); color: var(--muted);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px;
  box-shadow: var(--shadow); }
@media (max-width: 720px) {
  .bar { top: 8px; left: 8px; right: 8px; gap: 6px; }
  .title small { display: none; }
  #legend { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 45vh; }
  #legend.hidden { transform: translateY(calc(100% + 16px)); }
  .hint { display: none; }
  .group button { padding: 7px 9px; min-width: 34px; }
}
</style>
</head>

<div id="stage"><canvas id="cv"></canvas></div>

<div class="bar">
  <div class="title">Doodle Codex Valley<small id="sub"></small></div>
  <div class="group" role="group" aria-label="Zoom">
    <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
    <div class="zoomlbl" id="zlbl">100%</div>
    <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
  <div class="group" role="group" aria-label="Views">
    <button id="fit" title="Whole map">Fit</button>
    <button id="z1" title="Full size: one tile is 64 px">1:1</button>
    <button id="z3" title="Close-up">3×</button>
  </div>
  <div class="group" role="group" aria-label="Options">
    <button id="play" aria-pressed="false" title="Pause / play">Pause</button>
    <button id="grid" aria-pressed="false" title="Show the dual display grid">Grid</button>
    <button id="hex" aria-pressed="false" title="D&D-style hex overlay (H)">Hex</button>
    <button id="hideui" title="Hide all controls (Tab)">Hide UI</button>
  </div>
  <div class="spacer"></div>
  <div class="group"><button id="leg" aria-pressed="true">Legend</button></div>
</div>

<aside id="legend"></aside>
<div id="tip"></div>
<button id="showui" class="showui" title="Show controls (Tab)" aria-label="Show controls">☰</button>

// Every entity has a ground line (for y-sorting) and a draw(frame) at time t.
const ents = [];

W.people.forEach((p, i) => ents.push({

  cx: () => (p.x + .5) * T, cy: () => (p.y + .5) * T, ground: () => (p.y + 1) * T,
  bbox: () => [p.x * T, p.y * T, T, T],

W.monsters.forEach((m, i) => {

  const e = {
    kind: 'monster', label: pretty(m.creature), note: m.note, ref: m,
    pos(t) {

let now = 0;
function draw(tn) {
  if (!paused) now = tn / 1000 - tBase;
  stepFly(tn);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = scale * dpr;
  ctx.setTransform(s, 0, 0, s, Math.round(ox * dpr), Math.round(oy * dpr));
  ctx.imageSmoothingEnabled = s < 1; ctx.imageSmoothingQuality = 'high';
  const f = frameAt(now);
  const ti = terrain[f].complete ? terrain[f] : terrain.find(i => i.complete);
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 20 * s;
  if (ti) ctx.drawImage(ti, 0, 0, MW, MH);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  if (showGrid) {   // the dual grid: display tiles are offset half a cell from the logical grid
    ctx.strokeStyle = 'rgba(255,0,200,.55)'; ctx.lineWidth = 1 / scale;
    ctx.beginPath();
    for (let x = T / 2; x < MW; x += T) { ctx.moveTo(x, 0); ctx.lineTo(x, MH); }
    for (let y = T / 2; y < MH; y += T) { ctx.moveTo(0, y); ctx.lineTo(MW, y); }
    ctx.stroke();
  }
  if (showHex) drawHex();
  const order = ents.slice().sort((a, b) => a.ground() - b.ground());
  for (const e of order) e.draw(now);
  if (focus && now < focusUntil) {
    const [x, y, w, h] = focus.bbox(), pulse = .5 + .5 * Math.sin(now * 8);
    ctx.strokeStyle = 'rgba(224,110,50,' + (.5 + .5 * pulse) + ')'; ctx.lineWidth = 2.5 / scale;
    ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
  }
  requestAnimationFrame(draw);
}

// ---------- hex overlay ----------
// Pointy-top hexes, flat-to-flat = one tile (64 px), drawn over the terrain and under the actors.
const HW = T, HR = T / Math.sqrt(3), HV = HR * 1.5;
function hexPath(cx, cy) {
  for (let k = 0; k < 6; k++) {
    const a = Math.PI / 180 * (60 * k - 30);
    const x = cx + HR * Math.cos(a), y = cy + HR * Math.sin(a);
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function drawHex() {
  const P = pane();
  const x0 = (P.x - ox) / scale, y0 = (P.y - oy) / scale, x1 = (P.x + P.w - ox) / scale, y1 = (P.y + P.h - oy) / scale;
  const r0 = Math.max(0, Math.floor(y0 / HV) - 1), r1 = Math.min(Math.ceil(MH / HV), Math.ceil(y1 / HV) + 1);
  const c0 = Math.max(0, Math.floor(x0 / HW) - 1), c1 = Math.min(Math.ceil(MW / HW), Math.ceil(x1 / HW) + 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, MW, MH); ctx.clip();
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
    hexPath(c * HW + (r & 1 ? HW : HW / 2), r * HV + HR);
  ctx.strokeStyle = 'rgba(20,15,10,.75)'; ctx.lineWidth = 3.5 / scale; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,248,225,.85)'; ctx.lineWidth = 1.6 / scale; ctx.stroke();
  if (scale >= 1.3) {
    ctx.font = (11 / scale * Math.min(scale, 2)) + 'px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const cx = c * HW + (r & 1 ? HW : HW / 2), cy = r * HV + HR;
      ctx.lineWidth = 3 / scale; ctx.strokeStyle = 'rgba(20,15,10,.8)'; ctx.fillStyle = 'rgba(255,248,225,.95)';
      const t = String(c).padStart(2, '0') + String(r).padStart(2, '0');
      ctx.strokeText(t, cx, cy + HR * .55); ctx.fillText(t, cx, cy + HR * .55);
    }
  }
  ctx.restore();
}

// ---------- legend ----------
function buildLegend() {
  const L = document.getElementById('legend');
  const counts = { terrain: {}, pairs: new Set() };
  const names = ['water', 'ice', 'swamp', 'dirt', 'roads', 'grass', 'forest', 'mountain', 'peaks'];
  const firstCell = {};
  const byChar = { W: 'water', I: 'ice', S: 'swamp', D: 'dirt', R: 'roads', G: 'grass', F: 'forest', M: 'mountain', P: 'peaks' };
  W.grid.forEach((row, y) => Array.from(row).forEach((c, x) => {
    const n = byChar[c] || names[c] || c; counts.terrain[n] = (counts.terrain[n] || 0) + 1;
    if (!firstCell[n] || (Math.abs(x - W.w / 2) + Math.abs(y - W.h / 2)) < firstCell[n].d) firstCell[n] = { x, y, d: Math.abs(x - W.w / 2) + Math.abs(y - W.h / 2) };
  }));
  W.grid.forEach((row, y) => Array.from(row).forEach((c, x) => {
    for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
      const r = W.grid[y + dy]; if (!r || x + dx >= W.w) continue; const d = r[x + dx];
      if (d !== c) counts.pairs.add([byChar[c], byChar[d]].sort().join('|'));
    }
  }));
  let html = `<h2>Terrain <span>9 bases × 4 variants · ${counts.pairs.size} borders</span></h2>` +
    '<p>Borders are drawn with the corner-Wang transition atlases on a dual grid; open ground picks one of each terrain\'s four variants per tile. Toggle <b>Grid</b> to see the display tiles.</p>';
  const swatch = { water: '#8fb8d6', ice: '#dbe9f2', swamp: '#7d8a5a', dirt: '#c9a47a', roads: '#bdb6a6', grass: '#b7cf8e', forest: '#6f8f4e', mountain: '#a9a39a', peaks: '#e9ecef' };
  for (const n of names) {
    const c = firstCell[n]; if (!c) continue;
    html += `<div class="item" data-fx="${(c.x + .5) * T}" data-fy="${(c.y + .5) * T}"><canvas class="thumb" data-crop="${c.x},${c.y}"></canvas><div><div class="name">${pretty(n)}</div><div class="note">${counts.terrain[n]} cells</div></div></div>`;
  }
  const sec = (title, list, sub) => {
    html += `<h2>${title} <span>${sub || list.length}</span></h2>`;
    list.forEach(e => {
      const i = ents.indexOf(e);
      html += `<div class="item" data-ent="${i}"><canvas class="thumb" data-ent="${i}"></canvas><div><div class="name">${e.label}</div><div class="note">${e.note}</div></div></div>`;
    });
  };
  sec('Structures', ents.filter(e => e.kind === 'structure'));
  sec('Creatures', ents.filter(e => e.kind === 'monster'), '11 kinds');
  sec('Heroes', ents.filter(e => e.kind === 'hero'));
  sec('NPCs', ents.filter(e => e.kind === 'npc'));
  L.innerHTML = html;
  L.querySelectorAll('.item').forEach(el => el.onclick = () => {
    L.querySelectorAll('.item.on').forEach(o => o.classList.remove('on')); el.classList.add('on');
    if (el.dataset.ent) { const e = ents[+el.dataset.ent];
      focus = e; focusUntil = now + 3.5;
      flyTo(e.cx(), e.cy(), e.kind === 'structure' || (e.ref.box && e.ref.box[0] > 64) ? 2.5 : 3.5);
    } else { focus = null; flyTo(+el.dataset.fx, +el.dataset.fy, 2.5); }
    if (innerWidth <= 720) { L.classList.add('hidden'); document.getElementById('leg').setAttribute('aria-pressed', false); }
  });
  paintThumbs();
}
function paintThumbs() {
  document.querySelectorAll('#legend canvas.thumb').forEach(c => {
    c.width = 72; c.height = 72; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    const go = () => {
      g.clearRect(0, 0, 72, 72);
      if (c.dataset.crop) { const [x, y] = c.dataset.crop.split(',').map(Number);
        const im = terrain[0]; if (!im.complete) return im.addEventListener('load', go, { once: true });
        g.drawImage(im, x * T, y * T, T, T, 0, 0, 72, 72); return; }
      const e = ents[+c.dataset.ent]; let src, sw, sh;
      if (e.kind === 'monster') { const m = e.ref; const st = m.seq[0][0] === 'gone' ? 'idle' : m.seq[0][0];
        const fc = m.patrol ? 'down' : m.facing;
        const sp = W.sprites[m.creature + '/' + st + '/' + fc] || Object.entries(W.sprites).find(([k]) => k.startsWith(m.creature + '/'))[1];
        src = img(sp.file); sw = sp.w; sh = sp.h;
      } else if (e.kind === 'structure') { src = img(e.ref.file); sw = e.ref.w; sh = e.ref.h; }
      else { src = img(e.ref.file); sw = T; sh = T; }
      if (!src.complete) return src.addEventListener('load', go, { once: true });
      const k = Math.min(72 / sw, 72 / sh);
      g.imageSmoothingEnabled = k < 1;
      g.drawImage(src, 0, 0, sw, sh, (72 - sw * k) / 2, (72 - sh * k) / 2, sw * k, sh * k);
    };
    go();
  });
}

// ---------- boot ----------
document.getElementById('sub').textContent = `${W.w}×${W.h} tiles · ${W.monsters.length} creatures · ${W.people.length} people`;
resize(); scale = fitScale(); clampView(); label();
{ // #x,y,zoom in tiles opens on a spot: #13,13,3
  const h = location.hash.slice(1).split(',').map(Number);
  if (h.length === 3 && h.every(isFinite)) {
    scale = Math.min(MAXS, Math.max(MINS, h[2])); const [px, py] = center();
    ox = px - h[0] * T * scale; oy = py - h[1] * T * scale; clampView(); label();
  }
}
addEventListener('resize', () => { const c = [(vw / 2 - ox) / scale, (vh / 2 - oy) / scale]; resize();
  ox = vw / 2 - c[0] * scale; oy = vh / 2 - c[1] * scale; clampView(); });
buildLegend();
requestAnimationFrame(draw);
</script>
</body>
</html>
